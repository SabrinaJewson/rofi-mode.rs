[package]
name = "rofi-mode"
version = "0.5.0"
edition = "2021"
rust-version = "1.60.0"
description = "High-level library for creating Rofi plugins and custom modes"
repository = "https://github.com/SabrinaJewson/rofi-mode.rs"
license = "MIT"
keywords = ["rofi", "mode", "plugin"]
categories = ["api-bindings"]

[dependencies]
bitflags = "2.9.1"
cairo-rs = "0.22.0"
libc = "0.2.174"
pango = "0.22.0"
rofi-plugin-sys = { git = "https://github.com/SabrinaJewson/rofi-plugin-sys.rs", version = "0.6.0" }

[workspace]
members = ["dev", "examples/*"]
